[tox]
envlist = py{37,38,39,310,311,312,313,314,315}-{unit,nose2,pytest},pypy3-{unit,nose2,pytest},py{37,38,39}-{nose,pytest3,unit2}

[testenv]
setenv =
    pytest3: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
deps =
    nose: nose
    nose2: nose2
    pytest: pytest
    pytest3: pytest>=3,<4
    # Historical pytest imports pkg_resources, removed in setuptools 82.
    pytest3: setuptools<82
    unit2: unittest2
commands =
    unit: python -m unittest parameterized.test
    nose2: nose2
    pytest: python -m pytest parameterized/test.py
    nose: nosetests
    pytest3: python -m pytest parameterized/test.py
    unit2: unit2 parameterized.test
